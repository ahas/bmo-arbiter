repository = "bmo-arbiter"
base = false

[coverage]
# Every Cargo package's src/ and the repository's own client/ project, plus the node arbiter's Python package,
# but these: the crates' roots, which only list their modules.
layout = "bmo-next"
extensions = ["rs", "ts", "vue", "py"]
roots = ["card/"]
unindexed = ["src/lib.rs", "crates/client/src/lib.rs", "crates/plugin/src/lib.rs"]
