# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.
testbed = 0
name = "bmo-arbiter"

# The Cargo package, and the TypeScript client in `packages/arbiter-client`, a project of its own whose own
# `check` script is its check (`docs/api.md`, 「The clients and the harness plugin」). Every test is a test
# of the one Cargo package: the node arbiter's Python tests under `tests/card/` are run by a Cargo test of
# their own, so the suite gathers them with the rest.
[test]
languages = ["cargo", "bun"]
setup = ["bun install --cwd packages/arbiter-client --frozen-lockfile"]

[tools]
# The arbiter's own hosted tool, checked by the command its tool.toml names.
dir = "tools"

[check]
quick = ["layout", "dependencies", "korean", "cargo-profile", "shared-versions"]
# No code file holds Korean, so the ledger allows none anywhere.
korean_ledger = "korean-ledger.json"
# The crates of other repositories the arbiter may build on: the base libraries every unit may, and the
# published client of the node service it calls (docs/api.md, 「The node service」).
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-node-client"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the Cargo workspace. The testbed's own Cargo workspace check formats and lints
# every member, every target compiled, through its Cargo verb in the shared build directory, wherever a change
# marks a crate, and the change check compiles every crate a change marks; a change that marks none has no Rust
# to judge.

[build]
# The master's binary and the hosted tool's executable.
binaries = ["bmo-arbiter", "gpu-tool"]

# The master runs from its own deploy tree. A release is a worktree of the commit, so the `card/` package
# the master's install uploads to every node stands in it beside `bin/bmo-arbiter`, and the master reads
# both through the deploy link (docs/api.md, 「Settings」, `BMO_CODE_ROOT`). Its unit is a `binary` one,
# restarted only where its binary changed so no placement under way is cut, so no health is waited on.
[deploy]
root = "~/.local/share/bmo-arbiter"
data_root = "~/.local/share/bmo-arbiter/data"
units = ["deploy/systemd/*.service"]

# The tool is placed in its folder's .placed/: the executable the release's bin/ holds, its manifest, the
# schemas and the manual beside it.
[[deploy.step]]
id = "place-tools"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/gpu/.placed
mkdir -p tools/gpu/.placed
cp bin/gpu-tool tools/gpu/tool.toml tools/gpu/*.json tools/gpu/manual.md tools/gpu/.placed/
'''

# The tool is registered with the tool host once the master is up, as this service's own, so a supervisor
# reaches it with `bmo use bmo/gpu`.
[[deploy.step]]
id = "register-tools"
phase = "after-health"
command = '''
set -eu
bmo pocket put tools/gpu/.placed --placed --service bmo-arbiter --allow room.tools
'''
