# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "arbiter"

[[memory]]
key = "when"
type = "tip"
recall_condition = "a GPU card idle or busy, or a model to load"
text = "Read the cards with bmo/gpu; take a ticket with arbiter_ticket_take before loading a card."
