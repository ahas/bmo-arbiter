# The workspace: the master as the package at the root, with the library and the `bmo-arbiter` binary, and the
# crates it publishes under `crates/`: the client of both programs' routes and the harness plugin. The node
# arbiter is the Python package in `card/`, which the master uploads to every node; the repository checks and
# every test live in `tests/`. The version is the repository's one version: 0.1.0 with a revision until the
# first release (docs/api.md, 「Versions」).
[workspace]
members = ["crates/client", "crates/plugin", "tools/gpu"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.14"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonschema = { version = "0.58.6", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sse-stream = "0.2.6"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[package]
name = "bmo-arbiter"
description = "The card arbiter: the master placing services and planning every GPU node's card, and the node arbiter keeping each card's lock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

# The binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "bmo-arbiter"
path = "src/main.rs"
test = false

[dependencies]
axum.workspace = true
bmo-arbiter-client = { path = "crates/client" }
bmo-arbiter-plugin = { path = "crates/plugin" }
# The node service's published client, at the version this repository is built against (docs/api.md,
# 「The node service」).
bmo-node-client = { path = "../node/crates/client", version = "=0.1.0-rev.2" }
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
futures-util.workspace = true
# Walks a declaration root that is no git tree, keeping to its ignore files (docs/api.md, 「Declarations」).
ignore = "0.4.23"
regex = "1.11.1"
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
shlex = "2.0.1"
tempfile = "3.20.0"
tokio.workspace = true
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
gpu-tool = { path = "tools/gpu" }
# The stop's tests hold a call open on a bare connection and read its answers as HTTP.
httparse = "1.10.1"
jsonschema.workspace = true
libc = "0.2.177"
# The layout check reads the README's folder table as markdown.
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest.workspace = true
# The tests that wait run on a paused clock, which moves on whenever nothing else can.
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
