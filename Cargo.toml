# The master as one package at the root: the library and the `card-master` binary. The node arbiter is the
# Python package in `card/`, which the master uploads to every node; the repository checks and every test
# live in `tests/`.
[package]
name = "bmo-arbiter"
description = "The card arbiter: the master placing services and planning every GPU node's card, and the node arbiter keeping each card's lock."
version = "0.1.0"
edition = "2024"
publish = false

# The binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "card-master"
path = "src/main.rs"
test = false

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
futures-util = "0.3.34"
http-body-util = { version = "0.1.3", features = ["channel"] }
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
shlex = "2.0.1"
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
libc = "0.2.177"
# The layout check reads the README's folder table as markdown.
pulldown-cmark = { version = "0.13.4", default-features = false }
sse-stream = "0.2.6"
# The tests that wait run on a paused clock, which moves on whenever nothing else can.
tokio = { version = "1.47.0", features = ["macros", "rt", "test-util"] }
